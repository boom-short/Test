<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>PRX HASAN MOD</title>
    <style>
        html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background: #000; }
        iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; z-index:1; }
        .box { width: 110px; height: 100px; background: linear-gradient(135deg, #0a0a2e, #1a0a2e); border: 2px solid #ff00ff; border-radius: 16px; box-shadow: 0 0 15px rgba(255,0,255,0.6); color: #ff00ff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 10px 5px; position: fixed; top: 60px; left: 50px; z-index: 9999; cursor: move; user-select: none; backdrop-filter: blur(8px); animation: borderGlow 4s linear infinite; }
        @keyframes borderGlow { 0%,100% { border-color: #ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.6); } 50% { border-color: #00ffff; box-shadow: 0 0 25px rgba(0,255,255,0.9); } }
        .title { font-size: 12px; font-weight: bold; background: linear-gradient(90deg, #ff00ff, #00ffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; margin-bottom: 5px; }
        .time { font-size: 10px; color: #ff80ff; }
        .countdown { font-size: 14px; color: #fff; font-weight: bold; }
        .signal { font-size: 22px; font-weight: bold; margin-top: 5px; color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        #loginPart input { width: 80px; padding: 5px; background: rgba(0,0,0,0.6); border: 1px solid #ff00ff; border-radius: 6px; color: #fff; font-size: 11px; text-align: center; margin-bottom: 5px; }
        #loginPart button { padding: 4px 12px; background: linear-gradient(45deg, #ff00ff, #00ffff); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #wrong { color: #ff0000; font-size: 10px; display: none; margin-top: 5px; }
    </style>
</head>
<body>

<iframe src="https://hgnice.bet/#/register?invitationCode=473341624762"></iframe>

<div class="box" id="signalBox">
    <div id="loginPart">
        <div class="title">PRX LOGIN</div>
        <input type="password" id="passInput" placeholder="Password" autocomplete="off">
        <button onclick="checkPassword()">Login</button>
        <div id="wrong">Wrong Password!</div>
    </div>

    <div id="signalPart" style="display:none;">
        <div class="title">PRX HASAN</div>
        <div class="time" id="currentTime">--:--:--</div>
        <div class="countdown"><span id="countdown">30</span>s</div>
        <div class="signal" id="predicted">-</div>
    </div>
</div>

<script>
    const correctPassword = "Soikat";
    let lastSignalSecond = -1;

    function checkPassword() {
        const input = document.getElementById('passInput').value;
        if (input === correctPassword) {
            document.getElementById('loginPart').style.display = 'none';
            document.getElementById('signalPart').style.display = 'block';
            startSignalSystem();
        } else {
            document.getElementById('wrong').style.display = 'block';
            setTimeout(() => { document.getElementById('wrong').style.display = 'none'; }, 2000);
        }
    }

    function startSignalSystem() {
        updateGameTime();
        setInterval(updateGameTime, 1000);
    }

    function updateGameTime() {
        const now = new Date();
        const seconds = now.getSeconds();
        document.getElementById('currentTime').textContent = now.toLocaleTimeString();

        const countdownValue = 30 - (seconds % 30);
        document.getElementById('countdown').textContent = countdownValue;

        if ((seconds === 0 || seconds === 30) && seconds !== lastSignalSecond) {
            generateSignal();
            lastSignalSecond = seconds;
        }
    }

    function generateSignal() {
        const signals = ['BIG', 'SMALL'];
        // মূল লজিক অনুযায়ী র‍্যান্ডম সিগন্যাল
        let result = signals[Math.floor(Math.random() * signals.length)];

        // আপনার রিকুয়েস্ট অনুযায়ী ০.৫ সেকেন্ড পর রেজাল্ট উল্টে দেওয়া
        setTimeout(() => {
            let reversedResult = (result === 'BIG') ? 'SMALL' : 'BIG';
            const display = document.getElementById('predicted');
            display.textContent = reversedResult;
            
            // সিগন্যাল পরিবর্তনের ইফেক্ট
            display.style.opacity = 0;
            setTimeout(() => { display.style.opacity = 1; }, 100);
        }, 500); // ০.৫ সেকেন্ড বিলম্ব
    }

    // ড্র্যাগিং সিস্টেম
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
    const box = document.getElementById('signalBox');

    box.addEventListener('touchstart', dragStart);
    box.addEventListener('mousedown', dragStart);
    document.addEventListener('touchmove', drag);
    document.addEventListener('mousemove', drag);
    document.addEventListener('touchend', dragEnd);
    document.addEventListener('mouseup', dragEnd);

    function dragStart(e) {
        initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOffset;
        initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOffset;
        if (e.target === box || box.contains(e.target)) isDragging = true;
    }

    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
            currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;
            xOffset = currentX; yOffset = currentY;
            box.style.transform = `translate(${currentX}px, ${currentY}px)`;
        }
    }

    function dragEnd() { isDragging = false; }
</script>

</body>
</html>
